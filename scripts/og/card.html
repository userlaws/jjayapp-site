<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with:
     npm run og
     Design: blue card, app icon left, gold dash, big title, subtitle, site line. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: #2b5ca8;
        font-family: -apple-system, 'SF Pro', 'Helvetica Neue', system-ui, sans-serif;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 96px;
        -webkit-font-smoothing: antialiased;
      }

      .icon {
        width: 205px;
        height: 205px;
        border-radius: 23%;
        flex: none;
        box-shadow: 0 24px 60px rgba(10, 24, 48, 0.45);
      }

      .dash {
        width: 82px;
        height: 10px;
        border-radius: 6px;
        background: #dfa33c;
        margin-bottom: 38px;
      }

      h1 {
        color: #ffffff;
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.015em;
        line-height: 1.06;
        margin-bottom: 30px;
        max-width: 640px;
      }

      .sub {
        color: #b9cbeb;
        font-size: 35px;
        font-weight: 500;
        line-height: 1.34;
        max-width: 720px;
        margin-bottom: 34px;
      }

      .site {
        color: #8fa9d9;
        font-size: 27px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="icon-512.png" alt="" />
    <div>
      <div class="dash"></div>
      <h1>JJAY Campus Companion</h1>
      <p class="sub">Deadlines, building hours, professors, and events — one app for John Jay students.</p>
      <p class="site">jjayapp.com &nbsp;·&nbsp; Free on the App Store</p>
    </div>
  </body>
</html>
